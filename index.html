<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Açaí da Casa (exemplo) — Cardápio</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f6f0fa;color:#2b1036}
header{background:linear-gradient(135deg,#4a0e5c,#7b1fa2);color:#fff;padding:26px 18px 20px;text-align:center}
header h1{margin:0;font-size:1.8em}header p{margin:6px 0 0;opacity:.9}
.aviso{background:#fff3cd;color:#6b4e00;font-size:.8em;text-align:center;padding:6px}
nav{position:sticky;top:0;background:#fff;display:flex;overflow-x:auto;gap:8px;padding:10px;box-shadow:0 2px 6px #0001;z-index:2}
nav a{white-space:nowrap;padding:7px 12px;border-radius:20px;background:#efe3f5;color:#5a1470;text-decoration:none;font-size:.9em;font-weight:600}
main{max-width:640px;margin:auto;padding:10px 14px 120px}h2{color:#5a1470;margin:22px 0 10px}
.item{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px #0001}
.item b{display:block}.item small{color:#777}.pr{color:#7b1fa2;font-weight:700;margin-right:10px}
button.add{background:#7b1fa2;color:#fff;border:0;border-radius:50%;width:34px;height:34px;font-size:1.3em}
.ex{font-size:.75em;color:#999;text-align:center}
#bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px;box-shadow:0 -2px 8px #0002;display:flex;gap:10px;align-items:center}
#bar div{flex:1;font-size:.9em}#wa{background:#25d366;color:#fff;border:0;border-radius:24px;padding:12px 18px;font-weight:700;font-size:1em}
#lim{background:none;border:0;color:#999}
footer{text-align:center;color:#888;font-size:.85em;padding:20px}
</style></head><body>
<header><h1>🍇 Açaí da Casa</h1><p>Cardápio digital (exemplo)</p></header>
<div class="aviso">Exemplo IA Connect — personalizamos com sua marca</div>
<nav><a href="#copo">Açaí no copo</a><a href="#tigela">Na tigela</a><a href="#add">Adicionais</a><a href="#cremes">Cremes/Sorvetes</a><a href="#bebidas">Bebidas</a></nav>
<main id="m"><p class="ex">* Preços meramente ilustrativos (exemplo)</p></main>
<footer>Feito por <b>IA Connect</b></footer>
<div id="bar"><div id="tot">Carrinho vazio</div><button id="lim" onclick="cart=[];upd()">limpar</button><button id="wa" onclick="pedir()">Pedir no WhatsApp</button></div>
<script>
const M={copo:["Açaí no copo",[["Copo 300ml","Açaí puro batido",12],["Copo 500ml","Açaí puro batido",18],["Copo 700ml","Açaí puro batido",24]]],
tigela:["Açaí na tigela",[["Tigela tradicional","Açaí, banana, granola e leite em pó",22],["Tigela da Casa","Açaí, morango, leite ninho, paçoca e calda",28],["Tigela fitness","Açaí, banana, aveia e mel",25]]],
add:["Adicionais / complementos",[["Leite em pó","",2],["Leite condensado","",2],["Granola","",2],["Paçoca","",2.5],["Morango","",3],["Banana","",2],["Nutella","",5],["Leite Ninho","",3]]],
cremes:["Cremes / sorvetes",[["Creme de cupuaçu 300ml","",14],["Creme de ninho 300ml","",14],["Sorvete 2 bolas","",10]]],
bebidas:["Bebidas",[["Água mineral","",3],["Refrigerante lata","",6],["Suco natural 400ml","",8]]]};
const m=document.getElementById('m');let cart=[];const f=v=>'R$ '+v.toFixed(2).replace('.',',');
for(const k in M){let h=`<h2 id="${k}">${M[k][0]}</h2>`;M[k][1].forEach((it,i)=>{h+=`<div class="item"><div><b>${it[0]}</b><small>${it[1]}</small></div><div><span class="pr">${f(it[2])}</span><button class="add" onclick="cart.push(M['${k}'][1][${i}]);upd()">+</button></div></div>`});m.insertAdjacentHTML('beforeend',h)}
function upd(){const t=cart.reduce((a,b)=>a+b[2],0);document.getElementById('tot').innerHTML=cart.length?`<b>${cart.length} item(s)</b><br>${f(t)}`:'Carrinho vazio'}
function pedir(){if(!cart.length){alert('Adicione itens ao pedido');return}let c={};cart.forEach(i=>c[i[0]]=(c[i[0]]||0)+1);let txt='Olá! Quero fazer um pedido:\n';for(const n in c){const p=cart.find(i=>i[0]==n)[2];txt+=`- ${c[n]}x ${n} (${f(p*c[n])})\n`}txt+='Total: '+f(cart.reduce((a,b)=>a+b[2],0));window.open('https://wa.me/5573981024409?text='+encodeURIComponent(txt))}
</script></body></html>
